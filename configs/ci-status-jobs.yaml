  cloud-ingress-operator: "https://prow.ci.openshift.org/?type=periodic&job=*cloud-ingress-operator*e2e*promotion*"
  rbac-permissions-operator: "https://prow.ci.openshift.org/?type=periodic&job=*rbac-permissions-operator*e2e*promotion*"
