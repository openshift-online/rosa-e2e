# ci-status-jobs.yaml -- Lean source for ROSA CI daily status tracking.
#
# This is the hand-edited lean form. Team identity (Jira team ID, display
# name) is NOT stored here: each category references a team by org file name
# (the keys in configs/generated/org-teams.yaml, vendored from
# hybrid-platforms/org). `make configs` resolves this file plus the snapshot
# into configs/generated/ci-status-jobs.yaml, which is what the
# chai-bot rosa_ci_daily_health_report task and rosa-eng-dashboard fetch.
# `make configs-snapshot` regenerates the snapshot from a local org checkout
# (ORG_REPO, default ../org) after org team data changes.
#
# slack_channel/slack_alias on a category are overrides that win over the
# org snapshot; drop them once the org team file carries the right channel.
# Teams the org repo does not describe yet live under stopgaps: below.
#
# To add a new job: add an entry under the appropriate category.
# To add a new category: add a new top-level entry to the categories list.
# New scheduled coverage is informational unless production gating is verified;
# explicit gating: false keeps new jobs out of an existing category's gate.
# Placeholder schedules and event-only candidates need verified trigger wiring
# before inclusion. Definition existence does not depend on available run history.
#
# Each category has a scope that determines how its CI health maps to components:
#   component: Tests specific component(s). Must have a components list with
#              keys matching the hybrid-platforms/org component registry.
#   platform:  Tests the managed service platform as a whole. CI health from
#              platform tests contributes to every component's health indicator.
#   upstream:  Tests upstream OCP/HyperShift. Shown in exec summary only.
#
# gating is explicit on every category: true marks a production release gate
#   (staging results block promotion of the release bundle (bundle.yaml) to
#   production); false is informational signal only. Set at category level =
#   every job in the category. A job-level gating value overrides the category
#   default, so gating: false opts a single job out of a gating category (used
#   where a category mixes gating and non-gating jobs). Tracked in ROSAENG-62472.
#
# informing: true marks a job as informing signal in the OCP CI sense
#   (blocking vs informing): the job still runs and its latest result is
#   checked and listed in the daily report, but it is excluded from the
#   gating and non-gating pass rates, from category health counts, and from
#   the report's failure exit code. Use for pre-GA project validation whose
#   failures are expected project noise rather than release signal (e.g.
#   Seaplane regional jobs).

sippy_url: https://sippy.dptools.openshift.org/sippy-ng/release/rosa-stage

